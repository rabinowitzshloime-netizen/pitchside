name: Daily football update

on:
  schedule:
    - cron: "0 6 * * *"   # every day at 6am UK time (UTC)
  workflow_dispatch:       # lets you run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - run: python scripts/update_data.py .
      - name: Save new news and fixtures
        run: |
          git config user.name "pitchside-bot"
          git config user.email "pitchside-bot@users.noreply.github.com"
          git add -A data.json photos
          git diff --cached --quiet || git commit -m "Daily news and fixtures update"
          git push
